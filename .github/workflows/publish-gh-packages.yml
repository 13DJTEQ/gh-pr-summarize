{
    "name": "Publish to GitHub Packages",
    "on": {
        "push": {
            "tags": ["pypi-v*"]
        },
        "workflow_dispatch": {}
    },
    "jobs": {
        "publish": {
            "runs-on": "ubuntu-latest",
            "permissions": {
                "contents: read",
                "packages: write"
            },
            "steps": [
                {
                    "uses": "actions/checkout@v4"
                },
                {
                    "name": "Set up Python",
                    "uses": "actions/setup-python@v5",
                    "with": {
                        "python-version": "3.12"
                    }
                },
                {
                    "name": "Install build tools",
                    "run": "python -m pip install --upgrade pip && pip install build twine"
                },
                {
                    "name": "Build package",
                    "run": "python -m build --outdir dist/"
                },
                {
                    "name": "Publish to GitHub Packages",
                    "env": {
                        "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                    },
                    "run": "twine upload --repository-url https://upload.pkg.github.com/13DJTEQ --username 13DJTEQ --password $GITHUB_TOKEN dist/*"
                },
                {
                    "name": "Verify publication",
                    "run": "echo Package published to GitHub Packages"
                }
            ]
        }
    }
}
