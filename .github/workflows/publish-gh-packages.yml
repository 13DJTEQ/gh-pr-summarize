name: Publish to GitHub Packages
on:
  push:
    tags:
      - "pypi-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package
        run: |
          mkdir -p dist-python
          python -m build --outdir dist-python/
      - name: List dist
        run: ls -la dist-python/
      - name: Configure PyPI
        run: |
          rm -rf ~/.pypirc
          cat > ~/.pypirc << 'PYPIRC'
          [distutils]
          index-servers = github

          [github]
          repository = https://upload.pkg.github.com/${{ github.repository_owner }}
          username = ${{ github.actor }}
          password = ${{ secrets.GITHUB_TOKEN }}
          PYPIRC
          cat ~/.pypirc
      - name: Publish Package
        run: |
          twine upload --config-file ~/.pypirc --repository github dist-python/*.tar.gz dist-python/*.whl
          echo "PUBLISH_SUCCESS"
