[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-summarizer-ai"
version = "1.0.0"
description = "AI-powered PR summarization for GitHub"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alan Bradley", email = "alan13@agentmail.to"}]
license = {text = "MIT"}
dependencies = ["requests>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
pr-summarizer = "pr_summarizer.cli:main"

[project.urls]
Homepage = "https://github.com/13DJTEQ/gh-pr-summarize"
Repository = "https://github.com/13DJTEQ/gh-pr-summarize"

# GitHub Packages configuration
[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-dir]
pr_summarizer = "pr_summarizer"